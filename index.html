<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Getty Art Connections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <p class="museum-name">J. Paul Getty Museum</p>
      <h1 class="game-title">Art Connections</h1>
    </div>
  </header>

  <main class="game-main">

    <div class="instructions">
      Here are 8 paintings at the Getty Museum. 5 of them fit in the crossword grid; drag them to their appropriate boxes.
      The column should contain three paintings in the same genre. The row should contain three paintings by the same artist.
    </div>

    <!-- Check button -->
    <div class="check-bar">
      <button class="btn-check" id="checkBtn" disabled>Check answers</button>
    </div>

    <!-- Result area: axis reveal (after first check) + score (after win) -->
    <div class="result-bar" id="resultBar" hidden>
      <div class="axis-reveals">
        <div class="axis-reveal-tag vertical-tag">
          <span class="reveal-icon">↕</span>
          <span id="revealVertical"></span>
        </div>
        <div class="axis-reveal-tag horizontal-tag">
          <span class="reveal-icon">↔</span>
          <span id="revealHorizontal"></span>
        </div>
      </div>
      <div class="score-display" id="scoreDisplay" hidden>
        <span class="score-word" id="scoreWord"></span>
      </div>
    </div>

    <div class="game-board">

      <!-- Candidate pool — down the side -->
      <div class="pool-section">
        <p class="pool-heading">Artworks</p>
        <div class="candidate-pool" id="candidatePool"></div>
      </div>

      <!-- Cross grid — color-coded by axis -->
      <div class="cross-grid" id="crossGrid">

        <div class="grid-spacer"></div>
        <div class="cell cell-vertical"   data-pos="top"    id="cell-top"></div>
        <div class="grid-spacer"></div>

        <div class="cell cell-horizontal" data-pos="left"   id="cell-left"></div>
        <div class="cell cell-center"     data-pos="center" id="cell-center"></div>
        <div class="cell cell-horizontal" data-pos="right"  id="cell-right"></div>

        <div class="grid-spacer"></div>
        <div class="cell cell-vertical"   data-pos="bottom" id="cell-bottom"></div>
        <div class="grid-spacer"></div>

      </div>

    </div>

  </main>

  <!-- Hover image overlay -->
  <div class="img-overlay" id="imgOverlay">
    <img id="overlayImg" alt="">
  </div>

  <script src="puzzles.js"></script>
  <script src="game.js"></script>
</body>
</html>
