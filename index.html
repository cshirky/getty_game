<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Getty Art Connections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <p class="museum-name">J. Paul Getty Museum</p>
      <h1 class="game-title">Art Connections</h1>
    </div>
  </header>

  <main class="game-main">

    <p class="puzzle-title" id="puzzleTitle"></p>
    <div class="instructions" id="instructions"></div>

    <!-- Check button -->
    <div class="check-bar">
      <button class="btn-check" id="checkBtn" disabled>Check answers</button>
    </div>

    <!-- Result area: axis reveal (after first check) + score (after win) -->
    <div class="result-bar" id="resultBar" hidden>
      <div class="axis-reveals" id="crossAxisReveals" hidden>
        <div class="axis-reveal-tag vertical-tag">
          <span class="reveal-icon">↕</span>
          <span id="revealVertical"></span>
        </div>
        <div class="axis-reveal-tag horizontal-tag">
          <span class="reveal-icon">↔</span>
          <span id="revealHorizontal"></span>
        </div>
      </div>
      <div class="axis-reveals" id="ringAxisReveals" hidden></div>
      <div class="score-display" id="scoreDisplay" hidden>
        <span class="score-word" id="scoreWord"></span>
        <div class="next-puzzle-bar">
          <button class="btn-next" id="nextBtn" hidden>Next puzzle →</button>
        </div>
      </div>
    </div>

    <div class="game-board">

      <!-- Candidate pool — down the side -->
      <div class="pool-section">
        <p class="pool-heading">Artworks</p>
        <div class="candidate-pool" id="candidatePool"></div>
      </div>

      <!-- Cross grid — color-coded by axis -->
      <div class="cross-grid" id="crossGrid">

        <div class="grid-spacer"></div>
        <div class="cell cell-vertical"   data-pos="top"    id="cell-cross-top"></div>
        <div class="grid-spacer"></div>

        <div class="cell cell-horizontal" data-pos="left"   id="cell-cross-left"></div>
        <div class="cell cell-center"     data-pos="center" id="cell-cross-center"></div>
        <div class="cell cell-horizontal" data-pos="right"  id="cell-cross-right"></div>

        <div class="grid-spacer"></div>
        <div class="cell cell-vertical"   data-pos="bottom" id="cell-cross-bottom"></div>
        <div class="grid-spacer"></div>

      </div>

      <!-- Ring grid — 3x3, empty center, color-coded by axis, corners blend two axes -->
      <div class="ring-grid" id="ringGrid" hidden>

        <div class="cell cell-corner-tl cell-motif"       data-pos="topLeft"     id="cell-ring-topLeft"></div>
        <div class="cell cell-motif"                      data-pos="top"         id="cell-ring-top"></div>
        <div class="cell cell-corner-tr cell-motif"       data-pos="topRight"    id="cell-ring-topRight"></div>

        <div class="cell cell-nationality"                data-pos="left"       id="cell-ring-left"></div>
        <div class="cell cell-center-empty"><span class="center-mark">GETTY</span></div>
        <div class="cell cell-item"                       data-pos="right"      id="cell-ring-right"></div>

        <div class="cell cell-corner-bl cell-nationality" data-pos="bottomLeft" id="cell-ring-bottomLeft"></div>
        <div class="cell cell-decade"                     data-pos="bottom"     id="cell-ring-bottom"></div>
        <div class="cell cell-corner-br cell-decade"      data-pos="bottomRight" id="cell-ring-bottomRight"></div>

      </div>

    </div>

  </main>

  <!-- Hover image overlay -->
  <div class="img-overlay" id="imgOverlay">
    <img id="overlayImg" alt="">
  </div>

  <script src="puzzles.js"></script>
  <script src="game.js"></script>
</body>
</html>
